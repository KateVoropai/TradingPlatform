version: '3.8'
services:
  db:
    image: postgres
    container_name: "trading-platform-postgres"
    restart: on-failure
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"

  web:
    build: .
    container_name: "trading-platform-web"
    restart: on-failure
    ports:
      - 8000:8000
