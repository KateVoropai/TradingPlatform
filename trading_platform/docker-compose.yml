version: '3.8'
services:
  db:
    image: postgres
    container_name: "trading-platform-postgres"
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: "trading-platform-web"
    volumes:
      - .:/app
    restart: on-failure
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4
    container_name: pixel_pgadmin
    restart: on-failure
    env_file:
      - .env
    ports:
      - 5050:80
    depends_on:
      - db
    # volumes:
    #   - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis
    container_name: redis
    hostname: redis
    restart: on-failure
  
  celery:
    build: .
    container_name: "celery"
    restart: on-failure
    command: [ 'celery', '-A', 'trading_platform', 'worker', '-l', 'INFO' ]
    depends_on:
      - db
      - web
      - redis

  celery_beat:
    build: .
    container_name: "celery-beat"
    restart: on-failure
    command: [ 'celery', '-A', 'trading_platform', 'beat', '-l', 'INFO' ]
    depends_on:
      - db
      - web
      - redis

  flower:
    build: .
    container_name: "flower"
    restart: on-failure
    hostname: flower
    command: [ 'celery', '-A', 'trading_platform', 'flower' ]
    depends_on:
      - db
      - web
      - redis
    ports: 
      - 5555:5555
