version: '3.8'
services:
  db:
    image: postgres
    container_name: "trading-platform-postgres"
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: "trading-platform-web"
    volumes:
      - .:/app
    restart: on-failure
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4
    container_name: pixel_pgadmin
    restart: on-failure
    env_file:
      - .env
    ports:
      - 5050:80
    depends_on:
      - db
    # volumes:
    #   - pgadmin_data:/var/lib/pgadmin
